<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Charlie Game Hub</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#4f46e5}
    body{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,#091024 0%, #051025 100%);color:#e6eef6;margin:0;padding:40px}
    .wrap{max-width:960px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    h1{margin:0;font-size:22px}
    p.lead{margin:0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:22px}
    .card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6);position:relative}
    .game-title{font-weight:700;margin:0 0 8px}
    .desc{color:var(--muted);margin:0 0 12px;font-size:14px}
    .btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--accent),#7c3aed);border:none;padding:10px 14px;border-radius:10px;color:white;text-decoration:none;cursor:pointer;font-weight:600;transition:background 0.2s ease, transform 0.2s ease;}
    .btn:active{transform:translateY(1px)}
    .btn.dragover{background:#22c55e !important;cursor:copy !important;}
    .small{font-size:13px;color:var(--muted)}
    .footer{margin-top:28px;color:var(--muted);font-size:13px}
    .hint{background:rgba(255,255,255,0.02);padding:8px;border-radius:8px;color:var(--muted);font-size:13px}

    .dev-controls{display:flex;align-items:center;gap:10px}
    #devPanel input{padding:6px 8px;border-radius:6px;border:none;outline:none}
    #devPanel button{padding:6px 10px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
    #addGameBtn,#saveChangesBtn{display:none;margin-top:10px}
    #addGameBtn.active,#saveChangesBtn.active{display:inline-block}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Charlie Game Hub</h1>
        <p class="lead">Editable HTML with Dev Mode (local only)</p>
      </div>
      <div id="devPanel" class="dev-controls">
        <input type="password" id="devCodeInput" placeholder="Enter dev code" />
        <button id="enterDevBtn">Enter</button>
        <button id="addGameBtn">+ Add Game</button>
        <button id="saveChangesBtn">Save</button>
      </div>
    </header>

    <section class="grid" id="gameGrid"></section>

    <p class="footer">Public save stores data in browser localStorage. To fully publish changes, replace files or export HTML manually.</p>
  </div>

  <script>
    const grid = document.getElementById('gameGrid');
    const addGameBtn = document.getElementById('addGameBtn');
    const saveBtn = document.getElementById('saveChangesBtn');
    const enterDevBtn = document.getElementById('enterDevBtn');
    const devInput = document.getElementById('devCodeInput');
    let devMode = false;
    let games = JSON.parse(localStorage.getItem('gameEntries') || '[]');

    function renderGames(){
      grid.innerHTML = '';
      games.forEach((g,i)=>{
        const card=document.createElement('article');
        card.className='card';
        card.dataset.index=i;
        card.dataset.filename=g.filename||'';
        card.dataset.url=g.url||'';
        const btn=document.createElement('button');
        btn.className='btn';
        btn.textContent='Play';
        btn.onclick=()=>launchGame(btn);
        btn.ondragover=(ev)=>handleDragOver(ev,btn);
        btn.ondragleave=()=>btn.classList.remove('dragover');
        btn.ondrop=(ev)=>handleDrop(ev,btn);

        card.innerHTML=`
          <h2 class="game-title" contenteditable="${devMode}">${g.title}</h2>
          <p class="desc" contenteditable="${devMode}">${g.desc}</p>
        `;
        card.appendChild(btn);
        if(devMode){
          const hint=document.createElement('div');
          hint.className='small hint';
          hint.textContent='Drag a playable HTML file here to configure launch.';
          card.appendChild(hint);
        }
        grid.appendChild(card);
      });
    }

    function handleDragOver(ev,btn){
      ev.preventDefault();
      if(devMode){
        btn.classList.add('dragover');
        ev.dataTransfer.dropEffect='copy';
      }
    }

    function handleDrop(ev,btn){
      ev.preventDefault();
      btn.classList.remove('dragover');
      if(!devMode){alert('Not in dev mode.');return;}
      const file=ev.dataTransfer.files[0];
      if(!file)return;
      if(!file.name.endsWith('.html')){
        alert('Please drop an HTML file to make it playable.');
        return;
      }
      const card=btn.closest('.card');
      const idx=parseInt(card.dataset.index);
      const blobUrl=URL.createObjectURL(file);
      games[idx].url=blobUrl;
      games[idx].filename=file.name;
      btn.innerText='File has been added, come test it!';
      setTimeout(()=>btn.innerText='Play',2000);
    }

    function launchGame(btn){
      const card = btn.closest('.card');
      const url = card.dataset.url;
      if(!url){alert('No game configured. Drag a playable HTML file here in dev mode.');return;}
      window.open(url,'_blank');
    }

    enterDevBtn.onclick=()=>{
      if(devInput.value==='charliedev'){
        devMode=true;
        addGameBtn.classList.add('active');
        saveBtn.classList.add('active');
        alert('Dev mode enabled!');
        renderGames();
      }else alert('Invalid code.');
    }

    addGameBtn.onclick=()=>{
      if(!devMode)return;
      games.push({title:'New Game',desc:'Edit description...',url:'',filename:''});
      renderGames();
    }

    saveBtn.onclick=()=>{
      if(!devMode)return;
      document.querySelectorAll('.card').forEach((card,i)=>{
        games[i].title=card.querySelector('.game-title').innerText.trim();
        games[i].desc=card.querySelector('.desc').innerText.trim();
      });
      localStorage.setItem('gameEntries',JSON.stringify(games));
      alert('Changes saved!');
      devMode=false;
      addGameBtn.classList.remove('active');
      saveBtn.classList.remove('active');
      renderGames();
    }

    if(games.length===0){
      games=[
        {title:'Nightmare Manor',desc:'A tense, atmospheric horror exploration game.',url:'',filename:''},
        {title:'Brainrot Brawl',desc:'Multiplayer chaos — steal the brainrot and fight rivals.',url:'',filename:''}
      ];
    }

    renderGames();
  </script>
</body>
</html>
