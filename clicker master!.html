<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        /* Admin Panel Styles */
        .admin-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 50, 50, 0.2);
            border: 2px solid rgba(255, 50, 50, 0.5);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(255, 0, 0, 0.3);
            min-width: 280px;
            max-width: 300px;
            z-index: 1000;
        }

        .admin-panel h3 {
            margin-bottom: 15px;
            text-align: center;
            color: #ffcccc;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .admin-panel .admin-badge {
            background: rgba(255, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9em;
            border: 1px solid rgba(255, 100, 100, 0.5);
        }

        .admin-panel input,
        .admin-panel select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
        }

        .admin-panel button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            background: linear-gradient(145deg, #ff6b6b, #ff5252);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .admin-panel button:hover {
            transform: scale(1.02);
            background: linear-gradient(145deg, #ff5252, #ff3838);
        }

        .admin-section {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .admin-section h4 {
            margin-bottom: 10px;
            font-size: 0.95em;
            color: #ffdddd;
        }

        .admin-users-list {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.85em;
        }

        .admin-users-list div {
            padding: 5px;
            margin: 2px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* Login Panel Styles */
        .login-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 280px;
            z-index: 1000;
        }

        .login-panel h3 {
            margin-bottom: 15px;
            text-align: center;
        }

        .login-panel input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
        }

        .login-panel button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            background: linear-gradient(145deg, #ffd700, #ffed4e);
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-panel button:hover {
            transform: scale(1.02);
        }

        .login-panel .toggle-btn {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 12px;
            padding: 8px;
        }

        .login-panel .logout-btn {
            background: rgba(255, 100, 100, 0.7);
            color: white;
        }

        .user-info {
            text-align: center;
        }

        .user-info .username-display {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .admin-badge-user {
            background: linear-gradient(145deg, #ff6b6b, #ff5252);
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.7em;
            margin-left: 5px;
            display: inline-block;
        }

        .error-message {
            background: rgba(255, 100, 100, 0.8);
            padding: 8px;
            border-radius: 5px;
            margin: 5px 0;
            font-size: 12px;
            text-align: center;
        }

        .success-message {
            background: rgba(100, 255, 100, 0.8);
            padding: 8px;
            border-radius: 5px;
            margin: 5px 0;
            font-size: 12px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        /* Welcome Message */
        .welcome-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            font-size: 1.5em;
            font-weight: bold;
            z-index: 999;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 90%;
            margin-top: 80px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .score-display {
            font-size: 3em;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .click-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffd700, #ffed4e);
            border: none;
            font-size: 4em;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin: 20px 0;
        }

        .click-button:hover {
            transform: scale(1.05);
        }

        .click-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 10px;
            margin: 5px;
        }

        .upgrades {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .upgrade-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .upgrade-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .upgrade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-btn .title {
            font-weight: bold;
            font-size: 1.1em;
            display: block;
            margin-bottom: 5px;
        }

        .upgrade-btn .cost {
            color: #ffd700;
            font-weight: bold;
        }

        .upgrade-btn .owned {
            font-size: 0.8em;
            opacity: 0.8;
            margin-top: 5px;
            display: block;
        }

        .float-text {
            position: fixed;
            font-size: 2em;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        @keyframes floatUp {
            to {
                opacity: 0;
                transform: translateY(-100px);
            }
        }

        @media (max-width: 1200px) {
            .admin-panel {
                position: relative;
                top: 0;
                left: 0;
                margin: 0 auto 20px;
            }
        }

        @media (max-width: 768px) {
            .login-panel {
                position: relative;
                top: 0;
                right: 0;
                margin: 0 auto 20px;
            }

            .welcome-message {
                font-size: 1.2em;
                padding: 10px 20px;
            }

            .container {
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Admin Panel (Only visible to DDev) -->
    <div class="admin-panel hidden" id="adminPanel">
        <h3>⚡ ADMIN PANEL ⚡</h3>
        <div class="admin-badge">Administrator Access</div>
        
        <div class="admin-section">
            <h4>💰 Set User Money</h4>
            <input type="text" id="adminTargetUser" placeholder="Enter username" list="usersList">
            <datalist id="usersList"></datalist>
            <input type="number" id="adminMoneyAmount" placeholder="Enter amount" min="0">
            <button onclick="adminSetMoney()">Set Money</button>
        </div>

        <div class="admin-section">
            <h4>👥 All Users</h4>
            <div class="admin-users-list" id="adminUsersList"></div>
            <button onclick="refreshUsersList()">Refresh List</button>
        </div>

        <div id="adminMessageBox"></div>
    </div>

    <!-- Welcome Message -->
    <div class="welcome-message hidden" id="welcomeMessage">
        Hello, <span id="welcomeUsername"></span>! 👋
    </div>

    <!-- Login/Signup Panel -->
    <div class="login-panel">
        <!-- Login Form -->
        <div id="loginForm">
            <h3>🎮 Account</h3>
            <div id="messageBox"></div>
            <input type="text" id="username" placeholder="Username" autocomplete="username">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button onclick="login()">Sign In</button>
            <button class="toggle-btn" onclick="toggleForm()">Create New Account</button>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" class="hidden">
            <h3>✨ Create Account</h3>
            <div id="signupMessageBox"></div>
            <input type="text" id="newUsername" placeholder="Choose Username" autocomplete="off">
            <input type="password" id="newPassword" placeholder="Choose Password" autocomplete="new-password">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password">
            <button onclick="signup()">Create Account</button>
            <button class="toggle-btn" onclick="toggleForm()">Back to Sign In</button>
        </div>

        <!-- User Info (shown when logged in) -->
        <div id="userInfo" class="user-info hidden">
            <h3>👤 Profile</h3>
            <div class="username-display">
                @<span id="loggedUsername"></span>
                <span id="adminBadge" class="admin-badge-user hidden">ADMIN</span>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <h1>✨ Click Master ✨</h1>
        
        <div class="score-display">
            <span id="score">0</span> clicks
        </div>

        <button class="click-button" id="clickBtn">💎</button>

        <div class="stats">
            <div class="stat-item">
                <div>Per Click</div>
                <div id="perClick">1</div>
            </div>
            <div class="stat-item">
                <div>Per Second</div>
                <div id="perSecond">0</div>
            </div>
            <div class="stat-item">
                <div>Total Clicks</div>
                <div id="totalClicks">0</div>
            </div>
        </div>

        <div class="upgrades">
            <button class="upgrade-btn" id="upgrade1">
                <span class="title">🖱️ Better Cursor</span>
                <div>+1 per click</div>
                <div class="cost">Cost: <span id="cost1">10</span></div>
                <span class="owned">Owned: <span id="owned1">0</span></span>
            </button>

            <button class="upgrade-btn" id="upgrade2">
                <span class="title">👆 Auto Clicker</span>
                <div>+1 per second</div>
                <div class="cost">Cost: <span id="cost2">50</span></div>
                <span class="owned">Owned: <span id="owned2">0</span></span>
            </button>

            <button class="upgrade-btn" id="upgrade3">
                <span class="title">🏭 Click Factory</span>
                <div>+5 per second</div>
                <div class="cost">Cost: <span id="cost3">200</span></div>
                <span class="owned">Owned: <span id="owned3">0</span></span>
            </button>

            <button class="upgrade-btn" id="upgrade4">
                <span class="title">🤖 Click Bot</span>
                <div>+10 per click</div>
                <div class="cost">Cost: <span id="cost4">500</span></div>
                <span class="owned">Owned: <span id="owned4">0</span></span>
            </button>

            <button class="upgrade-btn" id="upgrade5">
                <span class="title">🏰 Click Empire</span>
                <div>+50 per second</div>
                <div class="cost">Cost: <span id="cost5">2000</span></div>
                <span class="owned">Owned: <span id="owned5">0</span></span>
            </button>

            <button class="upgrade-btn" id="upgrade6">
                <span class="title">🚀 Mega Multiplier</span>
                <div>+100 per click</div>
                <div class="cost">Cost: <span id="cost6">10000</span></div>
                <span class="owned">Owned: <span id="owned6">0</span></span>
            </button>
        </div>
    </div>

    <script>
        // Game state
        let score = 0;
        let clickPower = 1;
        let clicksPerSecond = 0;
        let totalClicks = 0;
        let currentUser = null;

        // Admin settings
        const ADMIN_USERS = ['DDev']; // Add more admin usernames here if needed

        // Upgrades data
        const upgrades = {
            upgrade1: { cost: 10, owned: 0, clickBonus: 1, cpsBonus: 0, multiplier: 1.15 },
            upgrade2: { cost: 50, owned: 0, clickBonus: 0, cpsBonus: 1, multiplier: 1.15 },
            upgrade3: { cost: 200, owned: 0, clickBonus: 0, cpsBonus: 5, multiplier: 1.15 },
            upgrade4: { cost: 500, owned: 0, clickBonus: 10, cpsBonus: 0, multiplier: 1.15 },
            upgrade5: { cost: 2000, owned: 0, clickBonus: 0, cpsBonus: 50, multiplier: 1.15 },
            upgrade6: { cost: 10000, owned: 0, clickBonus: 100, cpsBonus: 0, multiplier: 1.15 }
        };

        // DOM elements
        const clickBtn = document.getElementById('clickBtn');
        const scoreDisplay = document.getElementById('score');
        const perClickDisplay = document.getElementById('perClick');
        const perSecondDisplay = document.getElementById('perSecond');
        const totalClicksDisplay = document.getElementById('totalClicks');

        // ===== ADMIN FUNCTIONS =====

        function isAdmin(username) {
            return ADMIN_USERS.includes(username);
        }

        function showAdminPanel() {
            if (isAdmin(currentUser)) {
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('adminBadge').classList.remove('hidden');
                refreshUsersList();
            }
        }

        function hideAdminPanel() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminBadge').classList.add('hidden');
        }

        function adminSetMoney() {
            const targetUser = document.getElementById('adminTargetUser').value.trim();
            const amount = parseInt(document.getElementById('adminMoneyAmount').value);

            if (!targetUser) {
                showAdminMessage('Please enter a username!', true);
                return;
            }

            if (isNaN(amount) || amount < 0) {
                showAdminMessage('Please enter a valid amount!', true);
                return;
            }

            const users = JSON.parse(localStorage.getItem('clickerUsers') || '{}');

            if (!users[targetUser]) {
                showAdminMessage('User "' + targetUser + '" not found!', true);
                return;
            }

            // Set the user's money
            users[targetUser].gameData.score = amount;
            localStorage.setItem('clickerUsers', JSON.stringify(users));

            // If modifying current user, update display
            if (targetUser === currentUser) {
                score = amount;
                updateDisplay();
            }

            showAdminMessage('Set ' + targetUser + '\'s money to ' + amount + ' clicks!', false);
            document.getElementById('adminTargetUser').value = '';
            document.getElementById('adminMoneyAmount').value = '';
            refreshUsersList();
        }

        function refreshUsersList() {
            const users = JSON.parse(localStorage.getItem('clickerUsers') || '{}');
            const usersList = document.getElementById('adminUsersList');
            const datalist = document.getElementById('usersList');
            
            usersList.innerHTML = '';
            datalist.innerHTML = '';

            const usernames = Object.keys(users);
            
            if (usernames.length === 0) {
                usersList.innerHTML = '<div style="opacity: 0.6;">No users yet</div>';
                return;
            }

            usernames.forEach(username => {
                const userData = users[username].gameData;
                const div = document.createElement('div');
                div.innerHTML = `<strong>${username}</strong>: ${Math.floor(userData.score)} clicks`;
                usersList.appendChild(div);

                // Add to datalist for autocomplete
                const option = document.createElement('option');
                option.value = username;
                datalist.appendChild(option);
            });
        }

        function showAdminMessage(message, isError = true) {
            const messageBox = document.getElementById('adminMessageBox');
            messageBox.innerHTML = `<div class="${isError ? 'error-message' : 'success-message'}">${message}</div>`;
            setTimeout(() => {
                messageBox.innerHTML = '';
            }, 3000);
        }

        // ===== AUTHENTICATION FUNCTIONS =====

        function toggleForm() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('signupForm').classList.toggle('hidden');
            clearMessages();
        }

        function showMessage(elementId, message, isError = true) {
            const messageBox = document.getElementById(elementId);
            messageBox.innerHTML = `<div class="${isError ? 'error-message' : 'success-message'}">${message}</div>`;
            setTimeout(() => {
                messageBox.innerHTML = '';
            }, 3000);
        }

        function clearMessages() {
            document.getElementById('messageBox').innerHTML = '';
            document.getElementById('signupMessageBox').innerHTML = '';
        }

        function signup() {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!username || !password || !confirmPassword) {
                showMessage('signupMessageBox', 'Please fill in all fields!');
                return;
            }

            if (username.length < 3) {
                showMessage('signupMessageBox', 'Username must be at least 3 characters!');
                return;
            }

            if (password.length < 4) {
                showMessage('signupMessageBox', 'Password must be at least 4 characters!');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('signupMessageBox', 'Passwords do not match!');
                return;
            }

            // Get all users
            const users = JSON.parse(localStorage.getItem('clickerUsers') || '{}');

            // Check if username exists (ENFORCED - NO DUPLICATES!)
            if (users[username]) {
                showMessage('signupMessageBox', 'Username "' + username + '" is already taken!');
                return;
            }

            // Create new user
            users[username] = {
                password: password,
                gameData: {
                    score: 0,
                    clickPower: 1,
                    clicksPerSecond: 0,
                    totalClicks: 0,
                    upgrades: {
                        upgrade1: { cost: 10, owned: 0, clickBonus: 1, cpsBonus: 0, multiplier: 1.15 },
                        upgrade2: { cost: 50, owned: 0, clickBonus: 0, cpsBonus: 1, multiplier: 1.15 },
                        upgrade3: { cost: 200, owned: 0, clickBonus: 0, cpsBonus: 5, multiplier: 1.15 },
                        upgrade4: { cost: 500, owned: 0, clickBonus: 10, cpsBonus: 0, multiplier: 1.15 },
                        upgrade5: { cost: 2000, owned: 0, clickBonus: 0, cpsBonus: 50, multiplier: 1.15 },
                        upgrade6: { cost: 10000, owned: 0, clickBonus: 100, cpsBonus: 0, multiplier: 1.15 }
                    }
                }
            };

            localStorage.setItem('clickerUsers', JSON.stringify(users));
            showMessage('signupMessageBox', 'Account created successfully! Signing in...', false);

            setTimeout(() => {
                document.getElementById('username').value = username;
                document.getElementById('password').value = password;
                toggleForm();
                login();
            }, 1000);
        }

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showMessage('messageBox', 'Please enter username and password!');
                return;
            }

            const users = JSON.parse(localStorage.getItem('clickerUsers') || '{}');

            if (!users[username]) {
                showMessage('messageBox', 'User not found!');
                return;
            }

            if (users[username].password !== password) {
                showMessage('messageBox', 'Incorrect password!');
                return;
            }

            // Successful login
            currentUser = username;
            localStorage.setItem('lastLoggedInUser', username);
            showLoginSuccess();
            loadUserProgress();
            
            // Show admin panel if user is admin
            if (isAdmin(currentUser)) {
                showAdminPanel();
            }
        }

        function autoLogin() {
            const lastUser = localStorage.getItem('lastLoggedInUser');
            if (lastUser) {
                const users = JSON.parse(localStorage.getItem('clickerUsers') || '{}');
                if (users[lastUser]) {
                    currentUser = lastUser;
                    showLoginSuccess();
                    loadUserProgress();
                    
                    // Show admin panel if user is admin
                    if (isAdmin(currentUser)) {
                        showAdminPanel();
                    }
                }
            }
        }

        function showLoginSuccess() {
            // Hide login/signup forms
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            
            // Show user info
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('loggedUsername').textContent = currentUser;
            
            // Show welcome message
            document.getElementById('welcomeMessage').classList.remove('hidden');
            document.getElementById('welcomeUsername').textContent = currentUser;
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                saveUserProgress();
                currentUser = null;
                localStorage.removeItem('lastLoggedInUser');
                
                // Hide admin panel
                hideAdminPanel();
                
                // Reset UI
                document.getElementById('userInfo').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('welcomeMessage').classList.add('hidden');
                
                // Clear form fields
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                
                // Reset game to default
                resetGame();
            }
        }

        function resetGame() {
            score = 0;
            clickPower = 1;
            clicksPerSecond = 0;
            totalClicks = 0;
            
            // Reset upgrades
            upgrades.upgrade1 = { cost: 10, owned: 0, clickBonus: 1, cpsBonus: 0, multiplier: 1.15 };
            upgrades.upgrade2 = { cost: 50, owned: 0, clickBonus: 0, cpsBonus: 1, multiplier: 1.15 };
            upgrades.upgrade3 = { cost: 200, owned: 0, clickBonus: 0, cpsBonus: 5, multiplier: 1.15 };
            upgrades.upgrade4 = { cost: 500, owned: 0, clickBonus: 10, cpsBonus: 0, multiplier: 1.15 };
            upgrades.upgrade5 = { cost: 2000, owned: 0, clickBonus: 0, cpsBonus: 50, multiplier: 1.15 };
            upgrades.upgrade6 = { cost: 10000, owned: 0, clickBonus: 100, cpsBonus: 0, multiplier: 1.15 };
            
            updateDisplay();
        }

        function saveUserProgress() {
            if (!currentUser) return;

            const users = JSON.parse(localStorage.getItem('clickerUsers') || '{}');
            if (users[currentUser]) {
                users[currentUser].gameData = {
                    score,
                    clickPower,
                    clicksPerSecond,
                    totalClicks,
                    upgrades
                };
                localStorage.setItem('clickerUsers', JSON.stringify(users));
            }
        }

        function loadUserProgress() {
            if (!currentUser) return;

            const users = JSON.parse(localStorage.getItem('clickerUsers') || '{}');
            if (users[currentUser] && users[currentUser].gameData) {
                const data = users[currentUser].gameData;
                score = data.score || 0;
                clickPower = data.clickPower || 1;
                clicksPerSecond = data.clicksPerSecond || 0;
                totalClicks = data.totalClicks || 0;
                
                if (data.upgrades) {
                    Object.assign(upgrades, data.upgrades);
                }
                
                updateDisplay();
            }
        }

        // ===== GAME FUNCTIONS =====

        // Main click handler
        clickBtn.addEventListener('click', (e) => {
            score += clickPower;
            totalClicks++;
            updateDisplay();
            createFloatingText('+' + clickPower, e.clientX, e.clientY);
        });

        // Create floating text animation
        function createFloatingText(text, x, y) {
            const floatText = document.createElement('div');
            floatText.className = 'float-text';
            floatText.textContent = text;
            floatText.style.left = x + 'px';
            floatText.style.top = y + 'px';
            document.body.appendChild(floatText);

            setTimeout(() => {
                floatText.remove();
            }, 1000);
        }

        // Update display
        function updateDisplay() {
            scoreDisplay.textContent = Math.floor(score);
            perClickDisplay.textContent = clickPower;
            perSecondDisplay.textContent = clicksPerSecond;
            totalClicksDisplay.textContent = totalClicks;
            updateUpgradeButtons();
        }

        // Update upgrade buttons
        function updateUpgradeButtons() {
            Object.keys(upgrades).forEach(key => {
                const btn = document.getElementById(key);
                const upgrade = upgrades[key];
                const costDisplay = document.getElementById('cost' + key.slice(-1));
                const ownedDisplay = document.getElementById('owned' + key.slice(-1));
                
                costDisplay.textContent = Math.floor(upgrade.cost);
                ownedDisplay.textContent = upgrade.owned;
                
                btn.disabled = score < upgrade.cost;
            });
        }

        // Buy upgrade handler
        function buyUpgrade(upgradeKey) {
            const upgrade = upgrades[upgradeKey];
            
            if (score >= upgrade.cost) {
                score -= upgrade.cost;
                upgrade.owned++;
                upgrade.cost *= upgrade.multiplier;
                
                clickPower += upgrade.clickBonus;
                clicksPerSecond += upgrade.cpsBonus;
                
                updateDisplay();
            }
        }

        // Add event listeners for upgrade buttons
        Object.keys(upgrades).forEach(key => {
            document.getElementById(key).addEventListener('click', () => buyUpgrade(key));
        });

        // Passive income (clicks per second)
        setInterval(() => {
            if (clicksPerSecond > 0) {
                score += clicksPerSecond / 10;
                updateDisplay();
            }
        }, 100);

        // Auto-save every 5 seconds (only if logged in)
        setInterval(() => {
            if (currentUser) {
                saveUserProgress();
            }
        }, 5000);

        // Initial setup
        window.addEventListener('load', () => {
            autoLogin();
            if (!currentUser) {
                updateDisplay();
            }
        });

        // Save before closing
        window.addEventListener('beforeunload', () => {
            if (currentUser) {
                saveUserProgress();
            }
        });
    </script>
</body>
</html>
